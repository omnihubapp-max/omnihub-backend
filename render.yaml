# ================================================================
#  OmniHub — render.yaml
#  Infrastructure as Code for Render.com
#  Commit this file → Render auto-reads on deploy
# ================================================================

services:
  - type: web
    name: omnihub-backend
    runtime: node
    region: frankfurt
    plan: starter
    branch: main
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase:
          name: omnihub-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASS
        sync: false
      - key: SERVER_URL
        value: https://omnihub-backend.onrender.com
      - key: FRONTEND_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CHAPA_SECRET_KEY
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: OWNER_EMAIL
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: TELEBIRR_APP_ID
        sync: false
      - key: TELEBIRR_APP_KEY
        sync: false
      - key: TELEBIRR_SHORT_CODE
        sync: false
      - key: CBEBIRR_MERCHANT_ID
        sync: false
      - key: CBEBIRR_API_KEY
        sync: false
      - key: CBEBIRR_API_SECRET
        sync: false
      - key: ETB_PER_USD
        value: "55.5"
      - key: UPLOAD_DIR
        value: ./uploads/kyc
    disk:
      name: omnihub-uploads
      mountPath: /opt/render/project/src/uploads
      sizeGB: 1

databases:
  - name: omnihub-db
    databaseName: omnihub
    user: omnihub_user
    region: frankfurt
    plan: starter
    ipAllowList: []
